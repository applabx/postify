name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint:gate
      - run: npx prisma validate
      - run: npx tsx --test tests/*.test.ts
      - run: npm run build
