# GitHub Dependabot — automated dependency updates & security alerts
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # Prisma major versions require coordinated schema + migration work
      - dependency-name: "prisma"
      - dependency-name: "@prisma/client"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
