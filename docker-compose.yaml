services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postify
      POSTGRES_USER: postify
      POSTGRES_PASSWORD: postify_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postify"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (for BullMQ scheduler) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Postify app ─────────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    labels:
      coolify.managed: "true"
      traefik.enable: "true"
      traefik.http.routers.postify.entrypoints: "http"
      traefik.http.routers.postify.rule: "Host(`eehzi4dz98bay175wko3wqut.178.105.157.205.sslip.io`)"
      traefik.http.routers.postify.service: "postify"
      traefik.http.services.postify.loadbalancer.server.port: "3000"
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    external: true

volumes:
  postgres_data:
  redis_data:
