services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postify
      POSTGRES_USER: postify
      POSTGRES_PASSWORD: postify_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postify"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (for BullMQ scheduler) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Postify app ─────────────────────────────────────────────────────────
  # NOTE: All secrets (NEXTAUTH_SECRET, DATABASE_URL, etc.) are injected
  # by Coolify at runtime via Environment Variables in the dashboard.
  # Do NOT add secrets here or reference .env files that aren't in the repo.
  #
  # IMAGE SOURCE: after auth fix, update to:
  #   build: .
  # When Coolify build server is enabled, it will build from source.
  app:
    image: ghcr.io/applabx/postify:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      coolify.managed: "true"
      traefik.enable: "true"
      traefik.http.routers.postify.entrypoints: "http"
      traefik.http.routers.postify.rule: "Host(`postify.applabx.com`)"
      traefik.http.routers.postify.service: "postify"
      traefik.http.services.postify.loadbalancer.server.port: "3000"
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    external: true

volumes:
  postgres_data:
  redis_data:
